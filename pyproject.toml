[project]
name = "claude-watermark-remover"
version = "0.1.0"
description = "Remove AI watermark symbols, round-trip translate and paraphrase text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "ruamel-yaml>=0.18",
    "deep-translator>=1.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
# Only needed for watermark_detector, kept out of the default install because torch is large.
detector = [
    "torch>=2.0",
    # Capped below 5: BayesianDetectorModel.__init__ does not call post_init() there, so
    # from_pretrained raises AttributeError on all_tied_weights_keys. Verified on 4.57.6.
    "transformers>=4.46,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "watermark_detector"]
