[project]
name = "claude-watermark-remover"
version = "0.1.0"
description = "Remove LLM watermark symbols, round-trip translate and paraphrase text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "ruamel-yaml>=0.18",
    "deep-translator>=1.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
