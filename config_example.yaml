# Application configuration.
# Secrets (API keys) live in .env, see .env_example.

cleaning:
  enabled: true
  # Collapse repeated spaces and trailing whitespace after symbol replacement.
  normalize_whitespace: true
  # Which groups of symbols to touch.
  #   carriers    - invisible characters: zero-width, directional marks, exotic spaces.
  #   typography  - the visible tells: em and en dashes, curly quotes, ellipsis character.
  #   punctuation - ordinary typography that is not a tell: «» • · © ™ -> x. Off by default,
  #                 replacing it mangles quotations in other languages, maths and lists.
  tiers: [carriers, typography]

translation:
  enabled: true
  # google (free, no key) | mymicrosoft | mymemory (free, no key) | deepl (needs TRANSLATOR_API_KEY)
  provider: google
  # Intermediate language for the round trip: ru, de, fr, es, it, ...
  intermediate_language: de
  source_language: en
  # Max characters sent to the translator in one request.
  chunk_size: 4000

paraphrase:
  enabled: true
  # openrouter | openai | gemini | claude | ollama
  provider: openrouter
  # Model id as the selected provider names it.
  model: deepseek/deepseek-v4-flash-0731
  temperature: 0.7
  timeout: 120
  # Used by the openrouter provider only.
  base_url: https://openrouter.ai/api/v1
  # Used by the ollama provider only.
  ollama_api_url: http://localhost:11434

verification:
  # Score every stage with the SynthID detector to see whether the watermark actually went
  # away. Needs the detector extra: uv sync --extra detector
  # The detector only recognises the key set it was trained on, see watermark_detector/README.md.
  enabled: false
  detector_repo: joaogante/dummy_synthid_detector
  # Ungated mirror of the tokenizer the detector was trained against. Leave it empty to take
  # the tokenizer named by the detector itself, which is gated and needs HF_TOKEN.
  tokenizer_repo: unsloth/gemma-2b-it
  # Empty means cuda when it is available, cpu otherwise.
  device: ""
